# Postgres для тестов. Живой Supabase тесты не трогают.
#   docker compose -f docker-compose.test.yml up -d
#   cd bot && .venv/bin/python -m pytest
# Версии как в Supabase проекта: Postgres 17, pgvector 0.8.0 понадобится на этапе 3.
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_PASSWORD: test
    ports:
      # Нестандартный порт, чтобы не столкнуться с локальным Postgres, если он есть.
      - "127.0.0.1:54329:5432"
    # Данные в памяти: каждый подъём контейнера начинается с чистой базы.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
